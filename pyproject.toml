[project]
name = "video-caption"
version = "0.1.0"
description = "Video captioning, tracking and segmentation"
readme = "README.md"
authors = [
    { name = "Maryam Sayed", email = "maryamsayed207@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "flask>=3.0",
    "groq>=1.7.0",
    "edge-tts>=7.0",
    "gtts>=2.5.4",
    "moviepy>=2.2.1",
    "opencv-python>=5.0.0.93",
    "pillow>=11.3.0",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "ultralytics>=8.3",
]

# This is an application (scripts + web app), not an installable package,
# so uv must not try to build it. This also removes the "Expected a Python module
# at src/video_caption/__init__.py" error.
[tool.uv]
package = false
