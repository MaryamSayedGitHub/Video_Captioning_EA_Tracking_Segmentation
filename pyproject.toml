[project]
name = "video-caption"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maryam Sayed", email = "maryamsayed207@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arabic-reshaper>=3.0.1",
    "groq>=1.7.0",
    "gtts>=2.5.4",
    "moviepy>=2.2.1",
    "opencv-python>=5.0.0.93",
    "pillow>=11.3.0",
    "python-bidi>=0.6.11",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
video-caption = "video_caption:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
